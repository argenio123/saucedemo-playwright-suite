name: SauceDemo Regression

# One workflow, launched by Testomat.io (or push / schedule). It runs k6 first
# so the load-test summary exists, then runs the Playwright suite - functional,
# client-side performance, and the k6 result bridge (TC-063 to TC-070) - all
# reporting to Testomat.io. Because k6 always runs before the tests, launching
# ANY folder from Testomat.io works: the k6 cases find their data instead of
# skipping, and each carries the Grafana dashboard link.
on:
  workflow_dispatch:
    inputs:
      # Testomat.io sends the ids of the cases it wants run, pipe-separated.
      # GitHub rejects the dispatch with a 422 if sent an undeclared input, so
      # this must match Testomat.io's Input Variables tab.
      grep:
        description: Playwright --grep filter. Empty runs the whole suite.
        required: false
        default: ''
      testomatio-run:
        description: Testomat.io run id - passed automatically when launched from Testomat.io
        required: false
        default: ''
      k6_base_url:
        description: k6 load-test target - a host you own or a sandbox. Never SauceDemo.
        required: false
        default: 'https://test.k6.io'
  push:
    branches: [main]
  schedule:
    # 08:00 Manila time, weekdays.
    - cron: '0 0 * * 1-5'

jobs:
  test:
    name: Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Official Playwright image with Chromium and system deps preinstalled, so
    # there is no slow apt-get step. Tag must match @playwright/test (1.62.1).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link Playwright browser metadata
        run: npx playwright install chromium

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # Best effort: authenticate to Grafana Cloud so k6 can stream there. A bad
      # or missing token never breaks the run - k6 falls back to local execution.
      - name: Authenticate k6 with Grafana Cloud
        id: k6login
        continue-on-error: true
        run: k6 cloud login --token "$K6_CLOUD_TOKEN" --stack gigantictaco781
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}

      # Runs k6 BEFORE the Playwright suite so k6-summary.json exists when the
      # k6 result cases (TC-063 to TC-070) run - this is what stops them being
      # skipped. Streams to Grafana when authenticated and captures the run URL.
      # Non-fatal on a threshold breach; TC-063 enforces the gate downstream.
      - name: Run k6 load test
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event.inputs.k6_base_url || 'https://test.k6.io' }}
        run: |
          set +e
          if [ "${{ steps.k6login.outcome }}" = "success" ]; then
            echo "Cloud auth OK - executing locally and streaming to Grafana."
            k6 run --out cloud --summary-export=k6-summary.json k6/load-test.js 2>&1 | tee k6-output.txt
          else
            echo "No cloud auth - executing locally only."
            k6 run --summary-export=k6-summary.json k6/load-test.js 2>&1 | tee k6-output.txt
          fi
          URL=$(grep -oE 'https://[a-z0-9-]+\.grafana\.net[^ ]*runs/[0-9]+' k6-output.txt | head -1)
          if [ -n "$URL" ]; then echo "K6_GRAFANA_RUN_URL=$URL" >> "$GITHUB_ENV"; fi
          echo "Captured Grafana run URL: ${URL:-none}"

      # continue-on-error is deliberate: five functional cases detect SauceDemo's
      # published defects and are expected to fail. The guard step below turns a
      # real regression - anything beyond those five - into a red build.
      - name: Run the suite
        id: run
        continue-on-error: true
        shell: bash
        env:
          TESTOMATIO: ${{ secrets.TESTOMATIO }}
          TESTOMATIO_RUN: ${{ github.event.inputs.testomatio-run }}
          TESTOMATIO_TITLE: SauceDemo regression - build ${{ github.run_number }}
          K6_GRAFANA_RUN_URL: ${{ env.K6_GRAFANA_RUN_URL }}
          GREP: ${{ github.event.inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            echo "Running the subset selected in Testomat.io."
            npx playwright test --grep "$GREP"
          else
            echo "No filter supplied - running the whole suite."
            npx playwright test
          fi

      - name: Fail the build on an unexpected regression
        if: always()
        shell: bash
        run: |
          EXPECTED="TC-026 TC-048 TC-052 TC-053 TC-054"
          FAILED=$(node -e "
            const fs=require('fs');
            const p='results/case-results.json';
            if(!fs.existsSync(p)){console.error('no case report produced');process.exit(1);}
            const rows=JSON.parse(fs.readFileSync(p,'utf8'));
            console.log(rows.filter(r=>r.status==='FAILED').map(r=>r.tc).join(' '));
          ")
          echo "Failed cases: ${FAILED:-none}"
          for tc in $FAILED; do
            if [[ " $EXPECTED " != *" $tc "* ]]; then
              echo "::error::Unexpected failure in $tc - this is a regression, not a known defect."
              exit 1
            fi
          done
          echo "Only the five known defect detections failed (if any). Suite is healthy."

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saucedemo-results-${{ github.run_number }}
          path: |
            results/
            k6-summary.json
            k6-output.txt
          retention-days: 14
