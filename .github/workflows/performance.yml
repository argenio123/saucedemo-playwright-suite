name: Performance

# The round trip:
#   Testomat.io launches this workflow (CI profile) ->
#   k6 executes the load test, streaming to Grafana Cloud when authenticated ->
#   the Grafana run URL and k6's metrics are captured ->
#   Playwright reports every case, including the k6 result (TC-063), back to
#   Testomat.io, where the verdict, headline numbers and Grafana link appear.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      k6_base_url:
        description: k6 load-test target - must be a host you own or a sandbox. Never SauceDemo.
        required: false
        default: 'https://test.k6.io'
      testomatio-run:
        description: Testomat.io run id - passed automatically when launched from Testomat.io
        required: false
        default: ''

jobs:
  performance:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Official Playwright image: Chromium and system deps preinstalled, so no
    # slow apt step. Tag must match @playwright/test in package.json (1.62.1).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # Best effort: authenticate to Grafana Cloud so the k6 run can stream
      # there. continue-on-error means a bad or missing token never breaks the
      # round trip - the run just falls back to local execution.
      - name: Authenticate k6 with Grafana Cloud
        id: k6login
        continue-on-error: true
        run: k6 cloud login --token "$K6_CLOUD_TOKEN" --stack gigantictaco781
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}

      # Runs k6 and always writes k6-summary.json. If cloud auth succeeded it
      # also streams to Grafana (project 8414590 in options.cloud) and captures
      # the run URL into the environment for TC-063 to embed in the Testomat.io
      # result. The threshold gate is enforced later by TC-063, so this step is
      # non-fatal on a breach.
      - name: Run k6 load test
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event.inputs.k6_base_url || 'https://test.k6.io' }}
        run: |
          set +e
          if [ "${{ steps.k6login.outcome }}" = "success" ]; then
            echo "Cloud auth OK - executing locally and streaming to Grafana."
            k6 run --out cloud --summary-export=k6-summary.json k6/load-test.js 2>&1 | tee k6-output.txt
          else
            echo "No cloud auth - executing locally only."
            k6 run --summary-export=k6-summary.json k6/load-test.js 2>&1 | tee k6-output.txt
          fi
          URL=$(grep -oE 'https://[a-z0-9-]+\.grafana\.net[^ ]*runs/[0-9]+' k6-output.txt | head -1)
          if [ -n "$URL" ]; then echo "K6_GRAFANA_RUN_URL=$URL" >> "$GITHUB_ENV"; fi
          echo "Captured Grafana run URL: ${URL:-none}"

      # Reports every performance case to Testomat.io: the Playwright client-side
      # cases (TC-057 to TC-062) and the k6 result bridge (TC-063), which reads
      # k6-summary.json and carries the Grafana link. This is the return leg -
      # Grafana's result lands in Testomat.io. TC-063 fails the build if a k6
      # threshold was breached, so the gate survives.
      - name: Report performance results to Testomat.io
        env:
          TESTOMATIO: ${{ secrets.TESTOMATIO }}
          TESTOMATIO_RUN: ${{ github.event.inputs.testomatio-run }}
          TESTOMATIO_TITLE: Performance - build ${{ github.run_number }}
          K6_GRAFANA_RUN_URL: ${{ env.K6_GRAFANA_RUN_URL }}
        run: npx playwright test specs/06-performance.spec.ts specs/07-k6-performance-result.spec.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results-${{ github.run_number }}
          path: |
            results/
            k6-summary.json
            k6-output.txt
          retention-days: 14
