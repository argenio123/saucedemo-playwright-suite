name: Performance

# Runs automatically on every push, and can be launched by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      k6_base_url:
        description: k6 load-test target - must be a host you own or a sandbox. Never SauceDemo.
        required: false
        default: 'https://test.k6.io'

jobs:
  # Job 1 - client-side performance measured with Playwright against SauceDemo.
  # Single-session measurement, the same footprint as the functional suite.
  playwright-performance:
    name: Playwright performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The official Playwright image ships Chromium and every system dependency
    # preinstalled, so there is no apt-get step. That step was taking minutes on
    # every run because the runner's Azure apt mirrors intermittently time out
    # and fall back. The image tag MUST match the @playwright/test version in
    # package.json (1.62.1) or the bundled browser will not match the client.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Browsers are already in the image; this only links the version metadata.
      # No --with-deps, so no apt-get and no mirror stall.
      - run: npx playwright install chromium

      - name: Run the performance specs
        env:
          TESTOMATIO: ${{ secrets.TESTOMATIO }}
          TESTOMATIO_TITLE: Performance - build ${{ github.run_number }}
        run: npx playwright test specs/06-performance.spec.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-performance-${{ github.run_number }}
          path: results/
          retention-days: 14

  # Job 2 - server-side load with k6, streamed to Grafana Cloud when a token is
  # present. Targets the Grafana sandbox, NOT SauceDemo.
  k6-load:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # Runs the test ON Grafana Cloud's load generators (cloud-run-locally:
      # false), which is what makes it appear under Testing & synthetics ->
      # Performance. This is the config Grafana itself recommends: the cloud
      # projectID lives in options.cloud inside load-test.js, and the only
      # credential needed is K6_CLOUD_TOKEN.
      #
      # K6_CLOUD_TOKEN must be a token from the k6 app (Performance -> Settings).
      # A Grafana service-account or access-policy token gives "stack ID not
      # configured". If the secret is absent the run still executes on the runner
      # and the threshold gate still applies; only the cloud upload is skipped.
      - name: Run the load test
        uses: grafana/run-k6-action@v1
        env:
          BASE_URL: ${{ github.event.inputs.k6_base_url || 'https://test.k6.io' }}
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
        with:
          # Runs every .js in the k6 folder, so a new test authored in the
          # Grafana editor only needs to be dropped into k6/ - no workflow edit.
          path: k6/*.js
          cloud-run-locally: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary-${{ github.run_number }}
          path: k6-summary.json
          retention-days: 30
